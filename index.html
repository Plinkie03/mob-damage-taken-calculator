<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Damage Taken Calculator</title>

        <script src="script.js"></script>
        <link rel="stylesheet" href="style.css" />
    </head>

    <body>
        <main class="container">
            <h1>Damage Taken Calculator</h1>

            <table>
                <tbody>
                    <tr>
                        <th scope="row">Level (UNAVAILABLE)</th>
                        <td>
                            <input
                                disabled
                                id="level"
                                type="number"
                                min="1"
                                placeholder="100"
                            />
                        </td>
                    </tr>

                    <tr>
                        <th scope="row">Armor</th>
                        <td>
                            <input
                                id="armor"
                                type="number"
                                min="1"
                                placeholder="100"
                            />
                        </td>
                    </tr>

                    <tr>
                        <th scope="row">Defense Skill</th>
                        <td>
                            <input
                                id="defense-skill"
                                type="number"
                                min="1"
                                placeholder="100"
                            />
                        </td>
                    </tr>

                    <tr>
                        <th scope="row">Defense Bonus</th>
                        <td>
                            <input
                                id="defense-bonus"
                                type="number"
                                min="1"
                                placeholder="100"
                            />
                        </td>
                    </tr>

                    <tr>
                        <th scope="row">% Resistance</th>
                        <td>
                            <input
                                id="resistance"
                                type="number"
                                min="0"
                                max="100"
                                placeholder="100"
                            />
                        </td>
                    </tr>

                    <tr>
                        <th scope="row">Monster</th>
                        <td>
                            <select id="mob">
                                <option value="none">Select a monster</option>
                                <option value="minotaur">Minotaur</option>
                                <option value="gastropod">Gastropod</option>
                                <option value="ghost">Ghost</option>
                                <option value="iceslime">Ice Slime</option>
                                <option value="behemoth">Behemoth</option>
                                <option value="revenant">Revenant</option>
                                <option value="shadow">Shadow</option>
                                <option value="demon">Demon</option>
                                <option value="orc">Orc</option>
                                <option value="orcworker">Orc Worker</option>
                                <option value="orcmage">Orc Mage</option>
                                <option value="orcwarrior">Orc Warrior</option>
                                <option value="hunter">Hunter</option>
                                <option value="thief">Thief</option>
                                <option value="bandit">Bandit</option>
                                <option value="wildsoldier">
                                    Wild Soldier
                                </option>
                                <option value="wasp">Wasp</option>
                                <option value="berzerker">Berzerker</option>
                                <option value="shambler">Shambler</option>
                                <option value="bloodseeker">Bloodseeker</option>
                                <option value="slimespitter">
                                    Slimespitter
                                </option>
                                <option value="110">110</option>
                                <option value="netherslime">
                                    Nether Slime
                                </option>
                                <option value="120">120</option>
                                <option value="violator">Violator</option>
                                <option value="130">130</option>
                            </select>
                        </td>
                    </tr>
                </tbody>

                <tfoot>
                    <tr>
                        <th scope="row" colspan="2">
                            <button id="btn">Calculate</button>
                        </th>
                    </tr>
                </tfoot>
            </table>

            <div class="result">
                <table>
                    <caption>
                        Result
                    </caption>

                    <tbody>
                        <tr>
                            <th scope="row">Flat Reduction</th>
                            <td id="flat-red">1</td>
                        </tr>

                        <tr>
                            <th scope="row">Damage Range</th>
                            <td id="dmg-range">1-10</td>
                        </tr>

                        <tr>
                            <th scope="row">Damage Range (Crit)</th>
                            <td id="dmg-range-crit">1-10</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>

        <footer>
            Formula is not verified by Liam/Fhox, it's made out of a lot of
            research.
        </footer>
    </body>
</html>
